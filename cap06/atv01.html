<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AlagoasTech EAD - Cadastro de Novo Aluno</title>
</head>
<body>

    <header>
        <h1>AlagoasTech EAD</h1>
        <h2>Cadastro de Novo Aluno</h2>
        <p>Preencha os dados abaixo para criar sua conta na plataforma.</p>
    </header>

    <main>
        <form action="#" method="post">
            
            <fieldset>
                <legend>DADOS PESSOAIS</legend>

                <div>
                    <label for="nome">Nome completo </label><br>
                    <input type="text" id="nome" name="nome" placeholder="Ex.: Maria Silva de Oliveira" required>
                </div>

                <div>
                    <label for="cpf">CPF </label><br>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" required>
                </div>

                <div>
                    <label for="nascimento">Data de nascimento </label><br>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div>
                    <label for="email">E-mail </label><br>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div>
                    <label for="telefone">Telefone </label><br>
                    <input type="tel" id="telefone" name="telefone" placeholder="(82) 90000-0000" required>
                </div>

                <div>
                    <label>Gênero </label><br>
                    <input type="radio" id="genero_fem" name="genero" value="feminino" required>
                    <label for="genero_fem">Feminino</label>

                    <input type="radio" id="genero_masc" name="genero" value="masculino">
                    <label for="genero_masc">Masculino</label>

                    <input type="radio" id="genero_outro" name="genero" value="outro">
                    <label for="genero_outro">Outro</label>

                    <input type="radio" id="genero_nao_informar" name="genero" value="nao_informar">
                    <label for="genero_nao_informar">Prefiro não informar</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>DADOS ACADÊMICOS</legend>

                <div>
                    <label for="curso">Curso de interesse </label><br>
                    <select id="curso" name="curso" required>
                        <option value="">Selecione...</option>
                        <option value="web">Desenvolvimento Web</option>
                        <option value="prog">Lógica de Programação</option>
                        <option value="banco">Banco de Dados</option>
                    </select>
                </div>

                <div>
                    <label>Turno preferido:</label><br>
                    <input type="checkbox" id="turno_manha" name="turno[]" value="manha">
                    <label for="turno_manha">Manhã</label>

                    <input type="checkbox" id="turno_tarde" name="turno[]" value="tarde">
                    <label for="turno_tarde">Tarde</label>

                    <input type="checkbox" id="turno_noite" name="turno[]" value="noite">
                    <label for="turno_noite">Noite</label>
                </div>

                <div>
                    <label for="foto">Foto de perfil</label><br>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>

                <div>
                    <label for="apresentacao">Apresente-se brevemente</label><br>
                    <textarea id="apresentacao" name="apresentacao" rows="4" cols="50" placeholder="Conte um pouco sobre você, suas expectativas e objetivos..."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>ACESSO</legend>

                <div>
                    <label for="senha">Senha </label><br>
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirma_senha">Confirmar senha </label><br>
                    <input type="password" id="confirma_senha" name="confirma_senha" placeholder="Repita a senha" minlength="8" required>
                </div>

                <div>
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Declaro que li e aceito os <a href="#" target="_blank">Termos de Uso</a> e a <a href="#" target="_blank">Política de Privacidade</a> da plataforma. *</label>
                </div>
            </fieldset>

            <div>
                <button type="reset">Limpar</button>
                <button type="submit">Criar Conta</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 AlagoasTech EAD. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
