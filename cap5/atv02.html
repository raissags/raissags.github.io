<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="device-width, initial-scale=1.0">
        <title>Cadastro de Usuário</title>
    </head>
    <body>
        <h1>Cadastron de Usuário</h1>
        <form action="https://httpbin.org/post" method="post">
            <divi>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required minlength="3">

            </divi>
            <br>
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="8">
            </div>
            <br>
            <div>
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>
            <br>
            <fieldset>
                <legend>Gênero</legend>
                <input type="radio" id="genero_m" name="genero" value="masculino">
                <label for="genero_m">Masculino</label><br>

                <input type="radio" id="genero_f" name="genero" value="feminino">
                <label for="genero_f">Feminino</label><br>

                <input type="radio" id="genero_o" name="genero" value="outro">
                <label for="genero_o">Outro</label><br>

                <input type="radio" id="genero_p" name="genero" value="prefiro_nao_informar">
                <label for="genero_p">Prefiro não informar</label>
            </fieldset>
            <br>
            <div>
                <input type="checkbox" id="aceite" name="aceite" value="sim" required>
                <label for="aceite">Li e aceito os termos de uso</label>
            </div>
            <br>
            <div>
                <button type="submit">Criar conta</button>
                <button type="reset">Limpar campos</button>
            </div>
        </form>
        
    </body>
</html>
